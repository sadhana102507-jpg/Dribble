<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dribbble Clone</title>
  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="#">Dribbble Clone</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Explore</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Designers</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Sign In</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container text-center my-5">
    <h1 class="fw-bold">Discover the world’s top designers</h1>
    <p class="lead text-muted">Showcase your work and explore creative inspiration.</p>
    <button class="btn btn-danger btn-lg">Get Started</button>
  </div>

  <!-- Gallery Section -->
  <div class="container my-5">
    <h2 class="text-center mb-4">Popular Shots</h2>
    <div class="row g-4">
      <div class="col-md-4 col-sm-6">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/400x250" class="card-img-top" alt="Design 1">
          <div class="card-body text-center">
            <h5 class="card-title">Creative Design</h5>
            <p class="card-text text-muted">by Designer 1</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/400x250" class="card-img-top" alt="Design 2">
          <div class="card-body text-center">
            <h5 class="card-title">Minimal Art</h5>
            <p class="card-text text-muted">by Designer 2</p>
          </div>
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/400x250" class="card-img-top" alt="Design 3">
          <div class="card-body text-center">
            <h5 class="card-title">Web UI Concept</h5>
            <p class="card-text text-muted">by Designer 3</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2025 Created by <b>Sadhana</b></p>
  </footer>

  <!-- Bootstrap JS -->
  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
